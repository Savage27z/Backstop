<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Backstop</title>
<style>
:root{--bg:#0b0e11;--card:#141a20;--line:#242d36;--text:#e7edf3;--muted:#8b98a5;--ok:#3ecf8e;--bad:#ff5d5d;--warn:#f5b84b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:24px;display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media(max-width:760px){main{grid-template-columns:1fr}}
h1{grid-column:1/-1;margin:0;font-size:20px}h1 small{color:var(--muted);font-weight:400;margin-left:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h2{margin:0 0 12px;font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.row{display:flex;justify-content:space-between;padding:4px 0}.muted{color:var(--muted)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0 12px}.bar>i{display:block;height:100%;background:var(--ok)}
.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}
#chat{grid-column:1/-1}#msgs{height:220px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.m{padding:8px 10px;border-radius:8px;max-width:80%}.u{align-self:flex-end;background:#1d2a38}.a{background:#1a2128;border:1px solid var(--line)}
form{display:flex;gap:8px}input{flex:1;background:#0f1419;border:1px solid var(--line);color:var(--text);padding:10px;border-radius:8px}
button{background:var(--ok);color:#06210f;border:0;border-radius:8px;padding:0 16px;font-weight:600;cursor:pointer}
#log div{padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
</style></head><body><main>
<h1>Backstop <small id="mode"></small></h1>
<section class="card"><h2>Loss waterfall</h2>
<div class="row"><span>Operator bond remaining</span><b id="bondRem">-</b></div><div class="bar"><i id="bondBar" style="width:100%"></i></div>
<div class="row"><span>Senior backer loss</span><b id="seniorLoss">-</b></div>
<div class="row"><span>Vault value / stop level</span><b id="mtm">-</b></div>
<div class="row"><span>PnL</span><b id="pnl">-</b></div>
<div class="row"><span>Phase</span><b id="phase">-</b></div></section>
<section class="card"><h2>Position</h2>
<div class="row"><span>USDT</span><b id="usdt">-</b></div><div class="row"><span>WHSK</span><b id="whsk">-</b></div>
<div class="row"><span>Spot vs 30m average</span><b id="dev">-</b></div>
<div class="row"><span>Risk / size</span><b id="cfg">-</b></div>
<div class="row"><span>Circuit breaker</span><b id="stop">-</b></div></section>
<section class="card" id="chat"><h2>Chat</h2><div id="msgs"></div>
<form id="f"><input id="t" placeholder="status, why, pause, size 10%, risk low, unwind" autocomplete="off"><button>Send</button></form></section>
<section class="card" style="grid-column:1/-1"><h2>Decisions</h2><div id="log" class="muted"></div></section>
</main><script>
const $=id=>document.getElementById(id),u=(v)=>(Number(v)/1e6).toFixed(2),w=(v)=>(Number(v)/1e18).toFixed(2);
function add(t,c){const d=document.createElement('div');d.className='m '+c;d.textContent=t;$('msgs').append(d);$('msgs').scrollTop=1e9}
function show(s){
 $('mode').textContent=s.dryRun?'dry run, no trades sent':'live';
 const bond=Number(s.bond),rem=Number(s.bondRemaining);
 $('bondRem').textContent=u(s.bondRemaining)+' / '+u(s.bond)+' USDT';$('bondBar').style.width=(bond?100*rem/bond:0)+'%';
 $('bondBar').style.background=rem/bond<.3?'var(--bad)':'var(--ok)';
 $('seniorLoss').textContent=u(s.seniorLoss)+' USDT';$('seniorLoss').className=Number(s.seniorLoss)>0?'bad':'ok';
 $('mtm').textContent=u(s.markToMarket)+' / '+u(s.stopFloor);
 $('pnl').textContent=u(s.pnl);$('pnl').className=Number(s.pnl)<0?'bad':'ok';
 $('phase').textContent=s.phase;$('usdt').textContent=u(s.usdt);$('whsk').textContent=w(s.whsk);
 $('dev').textContent=(s.twapTick-s.spotTick)+' bps below';$('cfg').textContent=s.config.risk+' / '+s.config.sizeBps/100+'%'+(s.config.paused?' (paused)':'');
 $('stop').textContent=s.stopped?'TRIPPED':'armed';$('stop').className=s.stopped?'bad':'ok';
}
async function poll(){try{const r=await (await fetch('/api/status')).json();if(r.error)throw new Error(r.error);show(r.status);
 $('log').innerHTML=r.log.map(e=>'<div><span class="'+(e.executed?'ok':'')+'">'+new Date(e.at).toLocaleTimeString()+' '+e.action.toUpperCase()+'</span> '+e.reason+(e.detail?' <span class="warn">'+e.detail+'</span>':'')+'</div>').join('')||'No decisions yet.';
}catch(e){$('mode').textContent='error: '+e.message}}
$('f').onsubmit=async ev=>{ev.preventDefault();const t=$('t').value.trim();if(!t)return;$('t').value='';add(t,'u');
 const r=await (await fetch('/api/chat',{method:'POST',body:JSON.stringify({text:t})})).json();add(r.reply||r.error,'a');if(r.status)show(r.status);poll()};
add('Ask for status, or change size and risk. The vault contract sets the hard limits.','a');poll();setInterval(poll,5000);
</script></body></html>
